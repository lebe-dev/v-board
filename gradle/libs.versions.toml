[versions]
agp = "9.5.0"
kotlin = "2.2.21"
ktlint-plugin = "14.2.0"
ktlint-cli = "1.5.0"
detekt = "1.23.8"
junit = "5.11.4"
androidx-annotation = "1.9.1"
junit4 = "4.13.2"
robolectric = "4.17"
coroutines = "1.10.2"
compose-bom = "2026.05.01"
activity-compose = "1.13.0"
androidx-core = "1.17.0"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.1"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
sentry = "8.63.0"
sentry-plugin = "6.26.0"
executorch = "1.5.1"

[libraries]
executorch-android = { module = "org.pytorch:executorch-android", version.ref = "executorch" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry-plugin" }
